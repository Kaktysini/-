<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рапорт о изменении звания | 41-й ЭРК</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <!-- Сюда можно вставить логотип (img) -->
            <h1>41-Й ЭЛИТНЫЙ РАЗВЕДЫВАТЕЛЬНЫЙ КОРПУС</h1>
            <p>ПОРТАЛ СЛУЖЕБНЫХ РАПОРТОВ</p>
        </div>
    </header>

    <main class="report-form-container">
        <div class="form-header">
            <h2>Рапорт об изменении звания</h2>
            <p>Резервная система. Данные уходят напрямую в Канцелярию.</p>
        </div>

        <form id="reportForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="reporting">Докладывает *</label>
                    <input type="text" id="reporting" name="reporting" placeholder="Номер | Позывной | Звание" required>
                </div>

                <div class="form-group">
                    <label for="issuedBy">Кто выдал форму *</label>
                    <input type="text" id="issuedBy" name="issuedBy" placeholder="Номер | Позывной | Звание" required>
                </div>

                <div class="form-group full-width">
                    <label for="reportType">Тип рапорта *</label>
                    <select id="reportType" name="reportType" required>
                        <option value="Вступление в 41-й">Вступление в 41-й</option>
                        <option value="ИСПРАВЛЕНИЕ">ИСПРАВЛЕНИЕ (удалить старое и отправить новое)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="soldierInfo">Н | П бойца *</label>
                    <input type="text" id="soldierInfo" name="soldierInfo" placeholder="Номер | Позывной" required>
                </div>

                <div class="form-group">
                    <label for="steamId">SteamID *</label>
                    <input type="text" id="steamId" name="steamId" placeholder="765611980xxxxxxxx" required>
                </div>

                <div class="form-group">
                    <label for="oldRank">Старое звание *</label>
                    <input type="text" id="oldRank" name="oldRank" value="Кадет" required>
                </div>

                <div class="form-group">
                    <label for="newRank">Новое звание *</label>
                    <input type="text" id="newRank" name="newRank" value="Рядовой-рекрут" required>
                </div>

                <div class="form-group full-width">
                    <label for="reportDate">Дата рапорта *</label>
                    <input type="date" id="reportDate" name="reportDate" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">ОТПРАВИТЬ РАПОРТ</button>
                <button type="reset" class="btn-reset">СБРОСИТЬ</button>
            </div>
            
            <div id="formStatus" class="form-status"></div>
        </form>
    </main>
</body>
</html>
