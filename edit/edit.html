<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои рапорты | 41-й ЭРК</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #1e221f; padding: 20px; border-radius: 4px; border: 1px solid #374151;
            width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;
        }
        /* Стили для заголовков секций */
        .section-title {
            color: #4caf50;
            border-bottom: 1px solid #374151;
            padding-bottom: 10px;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Класс для скрытия полей в модальном окне */
        .hidden-field {
            display: none !important;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <h1>41-Й ЭЛИТНЫЙ РАЗВЕДЫВАТЕЛЬНЫЙ КОРПУС</h1>
            <p>ЛИЧНЫЙ КАБИНЕТ БОЙЦА</p>
            <div style="margin-top: 10px;">
                <a href="../dashboard/index.html" style="color: #4caf50; text-decoration: none; font-size: 14px; margin-right: 15px;">🏠 Главное меню</a>
                <button id="logoutBtn" class="btn-logout">Выйти</button>
            </div>
        </div>
    </header>

    <main class="report-form-container">
        <!-- СЕКЦИЯ 1: Рапорты об изменении звания -->
        <div id="rankChangeSection">
            <h3 class="section-title">📄 Рапорты об изменении звания</h3>
            <div id="rankChangeList">
                <p>Загрузка данных...</p>
            </div>
        </div>

        <!-- СЕКЦИЯ 2: Запросы на повышение -->
        <div id="promotionSection">
            <h3 class="section-title">📄 Запросы на проверку готовности к повышению</h3>
            <div id="promotionList">
                <p>Загрузка данных...</p>
            </div>
        </div>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО ДЛЯ РЕДАКТИРОВАНИЯ -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-top:0;">Редактирование рапорта</h2>
            <form id="editForm">
                <input type="hidden" id="editDocId">
                <input type="hidden" id="editFormType">
                
                <!-- Общие поля -->
                <div class="form-group">
                    <label>Докладывает</label>
                    <input type="text" id="editReporting" required>
                </div>

                <!-- ПОЛЯ ДЛЯ РАПОРТА ОБ ИЗМЕНЕНИИ ЗВАНИЯ (Скрываются, если это запрос на повышение) -->
                <div id="group-rank" class="rank-fields">
                    <div class="form-group">
                        <label>Кто выдал форму</label>
                        <input type="text" id="editIssuedBy">
                    </div>
                    <div class="form-group">
                        <label>Н | П бойца</label>
                        <input type="text" id="editSoldierInfo">
                    </div>
                    <div class="form-group">
                        <label>SteamID</label>
                        <input type="text" id="editSteamId">
                    </div>
                    <div class="form-group">
                        <label>Старое звание</label>
                        <input type="text" id="editOldRank">
                    </div>
                    <div class="form-group">
                        <label>Новое звание</label>
                        <input type="text" id="editNewRank">
                    </div>
                </div>

                <!-- ПОЛЯ ДЛЯ ЗАПРОСА НА ПОВЫШЕНИЕ (Скрываются, если это обычный рапорт) -->
                <div id="group-promotion" class="promotion-fields">
                    <div class="form-group">
                        <label>Запрашиваю проверку на повышение в звании</label>
                        <input type="text" id="editRequestedRank">
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn-submit">СОХРАНИТЬ</button>
                    <button type="button" class="btn-reset" onclick="closeModal()">ОТМЕНА</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="edit.js"></script>
</body>
</html>
